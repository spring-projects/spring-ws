import org.asciidoctor.gradle.model5.jvm.formatters.AsciidoctorjGenericOutputFormatter
import org.asciidoctor.gradle.model5.jvm.formatters.AsciidoctorjPdf

plugins {
	id "io.freefair.aggregate-javadoc" version "8.12.1"
	id "maven-publish"
	id "org.asciidoctor.jvm" version "5.1.0"
	id "org.asciidoctor.jvm.pdf" version "5.1.0"
	id "org.springframework.ws.conventions"
}

repositories {
	mavenCentral()
}

dependencies {
	javadoc(enforcedPlatform(project(":spring-ws-platform")))
	[":spring-ws-core", ":spring-ws-security", ":spring-ws-support", ":spring-ws-test", ":spring-xml"].each {
		javadoc(project(it))
		javadoc(project(path: it, configuration: "javadocClasspath"))
	}
}

asciidoc {
	toolchains {
		asciidoctorj {
			registeredOutputFormatters {
				springHtml(AsciidoctorjGenericOutputFormatter) {
					backend = "spring-html"
					copyResources = true
					enforcedDocType = "book"
					useModule("io.spring.asciidoctor.backends:spring-asciidoctor-backends", "0.0.5")
					useProcessIsolation()
				}
			}
			registeredOutputFormatters.named("pdf", AsciidoctorjPdf) {
				allowUriRead = true
				useProcessIsolation()
			}
		}
	}
	publications {
		main {
			sourceSet {
				sources {
					include "index.adoc"
				}
				resources {
					include "images/**"
				}
				attributes {
					add "allow-uri-read", true
					add "numbered", true
					add "spring-framework-version", springFrameworkVersion
					add "spring-ws-version", project.version
					add "toclevels", 4
				}
				baseDir.baseDirFollowsSourceFiles()
			}
			output "asciidoctorj", "springHtml", "html"
			output "asciidoctorj", "pdf"
		}
	}
}

tasks.register("asciidoc") {
	group = "documentation"
	description = "Runs all asciidoc conversions (alias for asciidoctorAll)."
	dependsOn("asciidoctorAll")
}

tasks.named("javadoc") {
	title = "Spring Web Services ${project.version} API"
	options {
		use = true
	}
}

def zip = tasks.register("zip", Zip) {
	destinationDirectory = project.layout.buildDirectory
	into("reference/html") {
		from tasks.named("asciidoctorHtml")
	}
	into ("reference/pdf") {
		from tasks.named("asciidoctorPdf")
	}
	into ("api") {
		from javadoc
	}
}

tasks.named("assemble") {
	dependsOn(zip)
}

publishing {
	publications {
		maven(MavenPublication) {
			artifact zip
		}
	}
}
